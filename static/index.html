<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLI Proxy API - Dashboard</title>
    <style>
        :root {
            --bg: #0f0f23;
            --card: #16213e;
            --accent: #00d4ff;
            --text: #e0e0e0;
            --border: #2a2a4a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 40px; }
        h1 { color: var(--accent); margin-bottom: 10px; font-size: 28px; }
        p { color: #888; margin-bottom: 40px; }
        .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px 40px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.2s;
            width: 280px;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.15);
        }
        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: #888; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CLI Proxy API</h1>
        <p>Select a dashboard to continue</p>
        <div class="cards">
            <a href="/management.html" class="card">
                <div class="card-icon">&#9881;</div>
                <div class="card-title">Management Center</div>
                <div class="card-desc">Authentication, configuration, models, and general server management</div>
            </a>
            <a href="/usage-extended.html" class="card">
                <div class="card-icon">&#128202;</div>
                <div class="card-title">Extended Usage</div>
                <div class="card-desc">Account usage stats, rate limits, cooldown status, and CSV export</div>
            </a>
        </div>
    </div>
</body>
</html>
