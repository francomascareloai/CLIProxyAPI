name: perf-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run performance gate
        run: |
          ./test/perf_gate.sh
