name: bench-regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmark regression gate
        run: |
          ./test/bench_regression.sh
